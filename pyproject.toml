[project]
name = "a2a-maestro-scanner"
version = "0.1.0"
description = "Discover A2A agents and run a MAESTRO-based threat analysis against them"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
a2a-maestro = "a2a_maestro.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["a2a_maestro*"]
